name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --build-tags=all

      - name: Vet
        run: make go/vet

      - name: Unit Tests
        run: make go/test

      - name: Integration Tests
        run: make go/test-integration