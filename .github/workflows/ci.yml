name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - name: Format
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: fmt

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Vet
        run: make go/vet

      - name: Test
        run: make go/test
