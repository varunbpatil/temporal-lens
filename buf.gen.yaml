version: v2
clean: true

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/varunbpatil/temporal-lens/protos/gen

plugins:
  - local: protoc-gen-go
    out: protos/gen
    opt:
      - paths=source_relative

  - local: protoc-gen-connect-go
    out: protos/gen
    opt:
      - paths=source_relative

  - local: protoc-gen-es
    out: ui/src/gen
    opt:
      - target=ts

  - local: protoc-gen-connect-query
    out: ui/src/gen
    opt:
      - target=ts
