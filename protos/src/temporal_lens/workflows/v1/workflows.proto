syntax = "proto3";

package temporal_lens.workflows.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "temporal_lens/common/v1/common.proto";

service WorkflowService {
  rpc GetSearchSchema(GetSearchSchemaRequest) returns (GetSearchSchemaResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Signal(SignalRequest) returns (SignalResponse);
  rpc Reset(ResetRequest) returns (ResetResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc Terminate(TerminateRequest) returns (TerminateResponse);
  rpc ListIndexes(ListIndexesRequest) returns (ListIndexesResponse);
  rpc DeleteIndex(DeleteIndexRequest) returns (DeleteIndexResponse);
}

message GetSearchSchemaRequest {}

message GetSearchSchemaResponse {
  temporal_lens.common.v1.SearchSchema schema = 1;
  bool read_only = 2;
}

message SearchRequest {
  temporal_lens.common.v1.FilterSpec filter = 1;
  temporal_lens.common.v1.SortSpec sort = 2;
  temporal_lens.common.v1.PaginationSpec pagination = 3;
}

message SearchResponse {
  repeated Workflow workflows = 1;
  int64 total_hits = 2;
  google.protobuf.Duration took = 3;
  string next_cursor = 4;
}

message Workflow {
  string id = 1;
  WorkflowMetadata metadata = 2;
  WorkflowData data = 3;
  string url = 4;
}

message WorkflowMetadata {
  string run_id = 1;
  string workflow_id = 2;
  string namespace = 3;
  string workflow_type = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;
  WorkflowStatus status = 7;
  repeated SearchAttribute search_attributes = 8;
}

enum WorkflowStatus {
  WORKFLOW_STATUS_UNSPECIFIED = 0;
  WORKFLOW_STATUS_RUNNING = 1;
  WORKFLOW_STATUS_COMPLETED = 2;
  WORKFLOW_STATUS_FAILED = 3;
  WORKFLOW_STATUS_TIMED_OUT = 4;
  WORKFLOW_STATUS_PAUSED = 5;
  WORKFLOW_STATUS_CONTINUED_AS_NEW = 6;
  WORKFLOW_STATUS_CANCELED = 7;
  WORKFLOW_STATUS_TERMINATED = 8;
}

message SearchAttribute {
  string key = 1;
  string value = 2;
}

message WorkflowData {
  map<string, google.protobuf.ListValue> inputs = 1;
  map<string, google.protobuf.ListValue> outputs = 2;
  repeated string errors = 3;
  repeated Activity activities = 4;
  repeated ChildWorkflow child_workflows = 5;
}

message Activity {
  string activity_id = 1;
  string activity_type = 2;
  map<string, google.protobuf.ListValue> inputs = 3;
  map<string, google.protobuf.ListValue> outputs = 4;
  repeated string errors = 5;
  int32 attempts = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
  bool paused = 9;
}

message ChildWorkflow {
  string workflow_id = 1;
  string namespace = 2;
  string workflow_type = 3;
  map<string, google.protobuf.ListValue> inputs = 4;
  map<string, google.protobuf.ListValue> outputs = 5;
  repeated string errors = 6;
  int32 attempts = 7;
  google.protobuf.Timestamp start_time = 8;
  google.protobuf.Timestamp end_time = 9;
}

message WorkflowSelection {
  oneof selection {
    temporal_lens.common.v1.FilterSpec filter = 1;
    ExecutionList executions = 2;
  }
}

message ExecutionList {
  repeated WorkflowExecution executions = 1;
}

message WorkflowExecution {
  string namespace = 1;
  string workflow_id = 2;
  string run_id = 3;
}

message SignalRequest {
  WorkflowSelection workflows = 1;
  string signal = 2;
  bytes payload = 3;
  string reason = 4;
}

message SignalResponse {}

message ResetRequest {
  WorkflowSelection workflows = 1;
  ResetTarget target = 2;
  string reason = 3;
  repeated ResetReapplyExcludeType exclude_types = 4;
}

// Event types not to reapply after the reset point.
enum ResetReapplyExcludeType {
  RESET_REAPPLY_EXCLUDE_TYPE_UNSPECIFIED = 0;
  RESET_REAPPLY_EXCLUDE_TYPE_SIGNAL = 1;
  RESET_REAPPLY_EXCLUDE_TYPE_UPDATE = 2;
  RESET_REAPPLY_EXCLUDE_TYPE_NEXUS = 3;
}

message ResetTarget {
  oneof target {
    google.protobuf.Empty first_workflow_task = 1;
    google.protobuf.Empty last_workflow_task = 2;
    int64 workflow_task_id = 3;
  }
}

message ResetResponse {}

message CancelRequest {
  WorkflowSelection workflows = 1;
  string reason = 2;
}

message CancelResponse {}

message TerminateRequest {
  WorkflowSelection workflows = 1;
  string reason = 2;
}

message TerminateResponse {}

message ListIndexesRequest {}

message ListIndexesResponse {
  repeated IndexInfo indexes = 1;
}

message IndexInfo {
  string name = 1;
}

message DeleteIndexRequest {
  string index = 1;
}

message DeleteIndexResponse {}
