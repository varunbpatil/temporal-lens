<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporal Lens</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
    }
    .message {
      text-align: center;
      padding: 2rem;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #1e293b;
    }
    h1 { margin: 0 0 1rem; }
    code {
      background: #334155;
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="message">
    <h1>Temporal Lens</h1>
    <p>UI assets are not embedded.</p>
    <p>Build with <code>-tags=ui</code> to include the frontend.</p>
  </div>
</body>
</html>
